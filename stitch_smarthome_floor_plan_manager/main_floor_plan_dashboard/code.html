<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .floor-plan-canvas {
            background-size: cover;
            background-position: center;
            position: relative;
            height: calc(100vh - 128px);
            overflow: hidden;
        }
        .pulse-on {
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .pulse-error {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .device-node {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .device-node:active {
            transform: scale(0.9);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<!-- Overlay Context Menu (Hidden by default, for micro-interactions demo) -->
<div class="hidden fixed z-[100] bg-white rounded-xl shadow-2xl p-2 min-w-[160px] border border-outline-variant opacity-0 scale-95 transition-all" id="device-menu">
<div class="flex items-center gap-3 p-3 hover:bg-surface-container rounded-lg cursor-pointer">
<span class="material-symbols-outlined text-primary">power_settings_new</span>
<span class="font-label-md text-label-md">Turn Off</span>
</div>

<span class="material-symbols-outlined text-secondary">tune</span>
<span class="font-label-md text-label-md">Settings</span>
</div>

<script>
        // Simple Interaction Logic
        document.querySelectorAll('.device-node').forEach(node => {
            node.addEventListener('click', (e) => {
                const menu = document.getElementById('device-menu');
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.add('opacity-100', 'scale-100');
                    menu.style.top = `${Math.min(e.clientY, window.innerHeight - 150)}px`;
                    menu.style.left = `${Math.min(e.clientX, window.innerWidth - 180)}px`;
                }, 10);
            });
        });

        // Close menu on click elsewhere
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.device-node') && !e.target.closest('#device-menu')) {
                const menu = document.getElementById('device-menu');
                menu.classList.remove('opacity-100', 'scale-100');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        });

        // Toggle Active State Mockup
        document.querySelectorAll('.device-node').forEach(node => {
            node.addEventListener('dblclick', () => {
                const circle = node.querySelector('div');
                if(circle.classList.contains('border-primary')) {
                    circle.classList.remove('border-primary', 'pulse-on');
                    circle.classList.add('border-outline-variant', 'grayscale', 'opacity-80');
                } else {
                    circle.classList.add('border-primary', 'pulse-on');
                    circle.classList.remove('border-outline-variant', 'grayscale', 'opacity-80');
                }
            });
        });
    </script>
