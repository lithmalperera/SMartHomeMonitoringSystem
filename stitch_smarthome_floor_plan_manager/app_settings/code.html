<script>
        // Micro-interaction for the logout button
        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', () => {
            if(confirm('Are you sure you want to log out?')) {
                logoutBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Logging out...';
                setTimeout(() => {
                    alert('Logged out successfully.');
                    location.reload();
                }, 1000);
            }
        });

        // Hover effects and haptic feedback simulations for menu items
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                // Potential for haptic feedback API if supported
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });

        // Atmosphere: subtle scroll shadow logic for the top bar
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-md');
                header.classList.remove('border-b');
            } else {
                header.classList.remove('shadow-md');
                header.classList.add('border-b');
            }
        });
    </script>
