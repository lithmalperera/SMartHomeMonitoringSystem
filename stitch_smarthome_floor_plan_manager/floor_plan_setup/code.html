<!-- Hidden Grid Item Template Script -->
<script>
        const gridContainer = document.getElementById('grid-container');
        const rowsInput = document.getElementById('rows-input');
        const colsInput = document.getElementById('cols-input');
        
        function updateGrid() {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            
            gridContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            // Re-render internal lines for visual effect
            gridContainer.innerHTML = '';
            // Only render a few cells to keep performance high if the user puts in 100x100
            const maxCells = 400; 
            const totalCells = Math.min(rows * cols, maxCells);
            
            for(let i=0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = "border-[0.5px] border-primary/10";
                gridContainer.appendChild(cell);
            }
        }

        // Event listeners for increment/decrement
        document.getElementById('rows-inc').addEventListener('click', () => { rowsInput.value = parseInt(rowsInput.value) + 1; updateGrid(); });
        document.getElementById('rows-dec').addEventListener('click', () => { if(rowsInput.value > 1) rowsInput.value = parseInt(rowsInput.value) - 1; updateGrid(); });
        document.getElementById('cols-inc').addEventListener('click', () => { colsInput.value = parseInt(colsInput.value) + 1; updateGrid(); });
        document.getElementById('cols-dec').addEventListener('click', () => { if(colsInput.value > 1) colsInput.value = parseInt(colsInput.value) - 1; updateGrid(); });
        
        rowsInput.addEventListener('change', updateGrid);
        colsInput.addEventListener('change', updateGrid);

        // Initial update
        updateGrid();

        // Micro-interaction for upload area
        const uploadArea = document.getElementById('upload-area');
        uploadArea.addEventListener('click', () => {
            uploadArea.classList.add('bg-primary/5', 'scale-[0.98]');
            setTimeout(() => {
                uploadArea.classList.remove('scale-[0.98]');
            }, 100);
        });
    </script>
